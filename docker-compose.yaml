services:
  shortener-postgres:
    image: postgres
    restart: always
    container_name: shortener-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: 
      - ./out/pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
      interval: 30s
      timeout: 10s
      retries: 5
  shortener-migrate:
    image: migrate/migrate
    volumes:
      - ./migrations/:/migrations
    command: 
      -path=/migrations -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@shortener-postgres:5432/${POSTGRES_DB}?sslmode=disable up
    restart: on-failure
    depends_on:
      shortener-postgres:
        condition: service_healthy
  
  shortener-redis: 
    image: redis:8
    environment: 
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - ./out/redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}